<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProofPath - GPS Capture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 200px; width: 100%; border-radius: 15px; }
        #camera-stream, #photo-preview { width: 100%; max-width: 400px; border-radius: 15px; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-xl">
        <h2 class="text-xl font-bold text-center mb-4 text-blue-600">ProofPath Verification</h2>
        
        <!-- Camera/Preview Section -->
        <div class="flex flex-col items-center mb-6">
            <video id="camera-stream" autoplay playsinline class="bg-black mb-4"></video>
            <img id="photo-preview" class="hidden bg-black mb-4" alt="Captured Proof">
            <canvas id="photo-canvas" class="hidden"></canvas>

            <div class="flex gap-2">
                <button id="capture-btn" class="bg-red-500 text-white px-6 py-3 rounded-full font-bold hover:bg-red-600 transition shadow-lg">
                    📸 Capture Proof
                </button>
                <button id="retake-btn" class="hidden bg-gray-500 text-white px-6 py-3 rounded-full font-bold hover:bg-gray-600 transition shadow-lg">
                    🔄 Retake
                </button>
                <button id="submit-btn" class="hidden bg-green-600 text-white px-6 py-3 rounded-full font-bold hover:bg-green-700 transition shadow-lg">
                    ✅ Submit Proof
                </button>
            </div>
        </div>

        <!-- Locality Head Card -->
        <div id="head-card" class="hidden mb-4 p-4 border-2 border-blue-100 bg-blue-50 rounded-xl flex items-center gap-4">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="w-12 h-12 rounded-full bg-white p-1 shadow">
            <div>
                <p class="text-[10px] text-gray-500 uppercase font-bold">Locality Head</p>
                <h3 id="head-name" class="text-md font-bold text-gray-800">Searching...</h3>
                <p id="head-area" class="text-xs text-gray-600">Locating area...</p>
            </div>
        </div>

        <!-- PROBLEM DESCRIPTION SECTION (New) -->
        <div id="description-section" class="hidden mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">Describe the Problem:</label>
            <textarea id="problem-text" rows="3" 
                class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" 
                placeholder="e.g. Water pipe leakage, road pothole, garbage accumulation..."></textarea>
            <p id="error-msg" class="text-red-500 text-xs mt-1 hidden">Please provide a description before submitting.</p>
        </div>

        <!-- Map Section -->
        <div id="map" class="mb-4"></div>
        <p id="location-text" class="text-center text-gray-600 font-medium text-sm">Fetching your locality...</p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. MOCK DATABASE
        const localityHeads = [
            { name: "John Doe", area: "North Sector", lat: 40.7128, lon: -74.0060 },
            { name: "Sarah Smith", area: "East Plaza", lat: 34.0522, lon: -118.2437 },
            { name: "Raj Patel", area: "South Gateway", lat: 19.0760, lon: 72.8777 },
            { name: "Elena Rodriguez", area: "West Valley", lat: 51.5074, lon: -0.1278 },
        ];

        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('photo-canvas');
        const preview = document.getElementById('photo-preview');
        const captureBtn = document.getElementById('capture-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const submitBtn = document.getElementById('submit-btn');
        const headCard = document.getElementById('head-card');
        const headName = document.getElementById('head-name');
        const headArea = document.getElementById('head-area');
        const descSection = document.getElementById('description-section');
        const problemText = document.getElementById('problem-text');
        const errorMsg = document.getElementById('error-msg');
        const locationText = document.getElementById('location-text');

        let currentCoords = { lat: 0, lon: 0 };

        // 2. Map Logic
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let marker;

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    currentCoords.lat = position.coords.latitude;
                    currentCoords.lon = position.coords.longitude;
                    map.setView([currentCoords.lat, currentCoords.lon], 15);
                    if (marker) map.removeLayer(marker);
                    marker = L.marker([currentCoords.lat, currentCoords.lon]).addTo(map);
                    locationText.innerText = `Location Locked: ${currentCoords.lat.toFixed(4)}, ${currentCoords.lon.toFixed(4)}`;
                });
            }
        }

        function findCorrespondingHead(userLat, userLon) {
            let closestHead = null;
            let minDistance = Infinity;
            localityHeads.forEach(head => {
                const dist = Math.sqrt(Math.pow(head.lat - userLat, 2) + Math.pow(head.lon - userLon, 2));
                if (dist < minDistance) {
                    minDistance = dist;
                    closestHead = head;
                }
            });
            return closestHead;
        }

        // 3. Camera Logic
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) { alert("Please allow camera access!"); }
        }

        // 4. Capture Logic
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            preview.src = canvas.toDataURL('image/png');

            const head = findCorrespondingHead(currentCoords.lat, currentCoords.lon);
            if(head) {
                headName.innerText = head.name;
                headArea.innerText = "Head of " + head.area;
                headCard.classList.remove('hidden');
            }

            // SHOW EVERYTHING
            video.classList.add('hidden');
            preview.classList.remove('hidden');
            descSection.classList.remove('hidden'); // Show description box
            captureBtn.classList.add('hidden');
            retakeBtn.classList.remove('hidden');
            submitBtn.classList.remove('hidden');
        });

        // 5. Retake Logic
        retakeBtn.addEventListener('click', () => {
            video.classList.remove('hidden');
            preview.classList.add('hidden');
            headCard.classList.add('hidden');
            descSection.classList.add('hidden'); // Hide description box
            problemText.value = ""; // Clear text
            errorMsg.classList.add('hidden');
            captureBtn.classList.remove('hidden');
            retakeBtn.classList.add('hidden');
            submitBtn.classList.add('hidden');
        });

        // 6. Submit Logic (With Validation)
        submitBtn.addEventListener('click', () => {
            const description = problemText.value.trim();

            if (description === "") {
                errorMsg.classList.remove('hidden'); // Show error if empty
                return;
            }

            const finalSubmission = {
                image: preview.src,
                latitude: currentCoords.lat,
                longitude: currentCoords.lon,
                localityHead: headName.innerText,
                problem: description,
                time: new Date().toISOString()
            };
            
            console.log("FINAL DATA FOR DATABASE:", finalSubmission);
            alert("SUCCESS!\nProblem reported to " + headName.innerText + "\n\nDescription: " + description);
            location.reload();
        });

        startCamera();
        getLocation();
    </script>
</body>
</html>
